name: Build AI briefing feed

on:
  push:
    branches: [main]
    paths:
      - selection.json
      - build_feed.py
      - .github/workflows/build-feed.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build curated RSS feed from publisher feeds
        run: python build_feed.py

      - name: Commit generated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-briefing.xml
          if git diff --cached --quiet; then
            echo "Feed is already up to date."
          else
            git commit -m "Build curated AI briefing feed"
            git push
          fi
